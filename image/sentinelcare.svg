<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0c1730" />
      <stop offset="100%" stop-color="#14244a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#0f192e" />
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e325c" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="275" x2="800" y2="275" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="425" x2="800" y2="425" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Glowing orb -->
  <circle cx="230" cy="240" r="160" fill="#2563eb" opacity="0.18" filter="url(#glow)" />
  <circle cx="600" cy="220" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

  <!-- LEFT: Smart Medical Watch Mockup -->
  <g transform="translate(60, 70)">
    <!-- Watch Strap Top -->
    <rect x="85" y="0" width="70" height="60" rx="10" fill="url(#bandGrad)" stroke="#3b82f6" stroke-opacity="0.2" />
    <!-- Watch Case -->
    <rect x="40" y="50" width="160" height="210" rx="36" fill="#090e1a" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.6" filter="url(#glow)" />
    <!-- Watch Bezel -->
    <rect x="52" y="62" width="136" height="186" rx="26" fill="#050811" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Watch Screen Header -->
    <circle cx="70" cy="80" r="4" fill="#10b981" />
    <text x="80" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">SENTINEL</text>
    <text x="165" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">09:42</text>
    
    <!-- Heart Rate Box -->
    <g transform="translate(62, 96)">
      <rect width="116" height="54" rx="12" fill="#0e172a" stroke="#2563eb" stroke-opacity="0.3" />
      <path d="M16 26 C12 20 8 28 16 36 C24 28 20 20 16 26 Z" fill="#ef4444" transform="translate(0, -6)" />
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">78</text>
      <text x="64" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">BPM</text>
      <!-- Pulse wave -->
      <path d="M12 42 L35 42 L42 32 L48 50 L54 36 L60 44 L66 40 L72 42 L105 42" fill="none" stroke="url(#pulseGrad)" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Mini stats: SpO2 and Temp -->
    <g transform="translate(62, 158)">
      <!-- SpO2 -->
      <rect width="55" height="42" rx="10" fill="#0e172a" stroke="#38bdf8" stroke-opacity="0.25" />
      <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#94a3b8">SpO₂</text>
      <text x="10" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">98%</text>

      <!-- Temp -->
      <g transform="translate(61, 0)">
        <rect width="55" height="42" rx="10" fill="#0e172a" stroke="#10b981" stroke-opacity="0.25" />
        <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#94a3b8">TEMP</text>
        <text x="10" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#10b981">36.6°</text>
      </g>
    </g>

    <!-- Fall Safe Indicator -->
    <g transform="translate(62, 208)">
      <rect width="116" height="26" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="4" fill="#10b981" />
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#6ee7b7">FALL SENSOR: SAFE</text>
    </g>

    <!-- Watch Strap Bottom -->
    <rect x="85" y="260" width="70" height="70" rx="10" fill="url(#bandGrad)" stroke="#3b82f6" stroke-opacity="0.2" />
  </g>

  <!-- RIGHT: Caregiver Web Dashboard Window -->
  <g transform="translate(300, 60)">
    <!-- Window Frame -->
    <rect width="440" height="360" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.3" filter="url(#glow)" />
    
    <!-- Titlebar -->
    <path d="M 0 16 Q 0 0 16 0 L 424 0 Q 440 0 440 16 L 440 40 L 0 40 Z" fill="#090e1a" />
    <circle cx="20" cy="20" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="20" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="20" r="5" fill="#10b981" opacity="0.8" />
    <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">SentinelCare | Caregiver Web Dashboard</text>
    <rect x="340" y="12" width="85" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
    <circle cx="352" cy="21" r="3" fill="#10b981" />
    <text x="362" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#34d399">LIVE SYNC</text>

    <!-- Live Telemetry Card -->
    <g transform="translate(20, 56)">
      <rect width="398" height="140" rx="12" fill="#090f1d" stroke="#1e293b" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Real-Time Vital Telemetry</text>
      <text x="320" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Patient: Silva. M</text>
      
      <!-- Graph Line -->
      <path d="M 20 110 Q 70 60, 110 80 T 180 50 T 260 90 T 320 40 T 380 70" fill="none" stroke="url(#pulseGrad)" stroke-width="2.8" stroke-linecap="round" />
      <circle cx="320" cy="40" r="5" fill="#38bdf8" />
      <line x1="320" y1="40" x2="320" y2="125" stroke="#38bdf8" stroke-dasharray="3 3" opacity="0.6" />
      
      <!-- Metrics row -->
      <g transform="translate(16, 32)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#60a5fa">HR: 78 bpm</text>
        <text x="90" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">SpO₂: 98%</text>
        <text x="180" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">Temp: 36.6°C</text>
        <text x="280" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">Motion: Normal</text>
      </g>
    </g>

    <!-- Two Bottom Cards: Alerts & Status -->
    <!-- Alerts List -->
    <g transform="translate(20, 210)">
      <rect width="250" height="130" rx="12" fill="#090f1d" stroke="#1e293b" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Recent Alerts & Reminders</text>

      <g transform="translate(14, 34)">
        <rect width="222" height="26" rx="6" fill="#1e293b" fill-opacity="0.5" />
        <circle cx="12" cy="13" r="3" fill="#34d399" />
        <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#cbd5e1">Medicine Taken - 08:30 AM</text>
      </g>

      <g transform="translate(14, 66)">
        <rect width="222" height="26" rx="6" fill="#1e293b" fill-opacity="0.5" />
        <circle cx="12" cy="13" r="3" fill="#38bdf8" />
        <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#cbd5e1">Caregiver App Synced (BLE)</text>
      </g>

      <g transform="translate(14, 98)">
        <rect width="222" height="26" rx="6" fill="#1e293b" fill-opacity="0.5" />
        <circle cx="12" cy="13" r="3" fill="#10b981" />
        <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#cbd5e1">No Falls Detected (Safe)</text>
      </g>
    </g>

    <!-- Architecture Badges Card -->
    <g transform="translate(282, 210)">
      <rect width="138" height="130" rx="12" fill="#090f1d" stroke="#1e293b" />
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Core Architecture</text>
      
      <g transform="translate(12, 34)">
        <rect width="114" height="20" rx="6" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-opacity="0.4" />
        <text x="10" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#60a5fa">Flutter Mobile App</text>
      </g>
      <g transform="translate(12, 60)">
        <rect width="114" height="20" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.4" />
        <text x="10" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#fbbf24">Firebase Realtime</text>
      </g>
      <g transform="translate(12, 86)">
        <rect width="114" height="20" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
        <text x="10" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#34d399">IoT BLE Sensors</text>
      </g>
    </g>
  </g>
</svg>