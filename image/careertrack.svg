<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="careerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0c172d" />
      <stop offset="100%" stop-color="#142347" />
    </linearGradient>
    <linearGradient id="colBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f192d" />
      <stop offset="100%" stop-color="#090f1d" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182747" />
      <stop offset="100%" stop-color="#111c33" />
    </linearGradient>
    <filter id="careerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#careerBg)" />

  <circle cx="220" cy="180" r="160" fill="#2563eb" opacity="0.14" filter="url(#careerGlow)" />
  <circle cx="680" cy="300" r="150" fill="#38bdf8" opacity="0.12" filter="url(#careerGlow)" />

  <!-- Main Window -->
  <g transform="translate(50, 40)">
    <!-- Browser Frame -->
    <rect width="700" height="420" rx="16" fill="#0b1326" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.3" filter="url(#careerGlow)" />

    <!-- Titlebar -->
    <path d="M 0 16 Q 0 0 16 0 L 684 0 Q 700 0 700 16 L 700 44 L 0 44 Z" fill="#080d19" />
    <circle cx="22" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="54" cy="22" r="5" fill="#10b981" opacity="0.8" />
    
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">CareerTrack<tspan fill="#38bdf8">.io</tspan></text>
    
    <!-- User Profile Badge -->
    <g transform="translate(540, 10)">
      <rect width="140" height="24" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-opacity="0.25" />
      <circle cx="16" cy="12" r="7" fill="#3b82f6" />
      <text x="30" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0">Chamodi Silva</text>
    </g>

    <!-- Top KPI Metrics Bar -->
    <g transform="translate(24, 56)">
      <!-- Metric 1 -->
      <rect width="150" height="50" rx="10" fill="#111c33" stroke="#1e293b" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">TOTAL APPLICATIONS</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">24</text>
      <text x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">active</text>

      <!-- Metric 2 -->
      <g transform="translate(166, 0)">
        <rect width="150" height="50" rx="10" fill="#111c33" stroke="#2563eb" stroke-opacity="0.3" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">IN INTERVIEW</text>
        <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#60a5fa">6</text>
        <text x="34" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#60a5fa">stages</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(332, 0)">
        <rect width="150" height="50" rx="10" fill="#111c33" stroke="#10b981" stroke-opacity="0.3" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">OFFERS RECEIVED</text>
        <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#34d399">2</text>
        <text x="34" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34d399">congrats!</text>
      </g>

      <!-- Button -->
      <g transform="translate(506, 8)">
        <rect width="146" height="34" rx="8" fill="#2563eb" />
        <text x="24" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">+ New Application</text>
      </g>
    </g>

    <!-- Kanban Columns -->
    <g transform="translate(24, 120)">
      <!-- Column 1: Applied (3 cards) -->
      <g transform="translate(0, 0)">
        <rect width="206" height="280" rx="12" fill="url(#colBg)" stroke="#1e293b" />
        <circle cx="18" cy="20" r="4" fill="#38bdf8" />
        <text x="28" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Applied (12)</text>

        <!-- Card 1 -->
        <g transform="translate(10, 38)">
          <rect width="186" height="70" rx="8" fill="url(#cardBg)" stroke="#2563eb" stroke-opacity="0.25" />
          <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Software Engineer Intern</text>
          <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">🏢 WSO2 • Colombo</text>
          <rect x="12" y="46" width="60" height="16" rx="4" fill="#2563eb" fill-opacity="0.2" />
          <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#60a5fa">Full-Time</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(10, 116)">
          <rect width="186" height="70" rx="8" fill="url(#cardBg)" stroke="#1e293b" />
          <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Frontend Developer</text>
          <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">🏢 IFS R&amp;D • Remote</text>
          <rect x="12" y="46" width="50" height="16" rx="4" fill="#38bdf8" fill-opacity="0.15" />
          <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#38bdf8">React</text>
        </g>
      </g>

      <!-- Column 2: Interviewing (2 cards) -->
      <g transform="translate(222, 0)">
        <rect width="206" height="280" rx="12" fill="url(#colBg)" stroke="#2563eb" stroke-opacity="0.3" />
        <circle cx="18" cy="20" r="4" fill="#f59e0b" />
        <text x="28" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Interviewing (6)</text>

        <!-- Card 1 -->
        <g transform="translate(10, 38)">
          <rect width="186" height="84" rx="8" fill="url(#cardBg)" stroke="#f59e0b" stroke-opacity="0.4" />
          <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Associate SE - Backend</text>
          <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">🏢 Sysco LABS</text>
          <rect x="12" y="44" width="162" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15" />
          <text x="18" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#fbbf24">⚡ Tech Round 2: Tomorrow</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(10, 130)">
          <rect width="186" height="74" rx="8" fill="url(#cardBg)" stroke="#1e293b" />
          <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Full-Stack Intern</text>
          <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">🏢 99x Technology</text>
          <rect x="12" y="46" width="95" height="16" rx="4" fill="#818cf8" fill-opacity="0.2" />
          <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#a5b4fc">HR Interview Done</text>
        </g>
      </g>

      <!-- Column 3: Offers (1 card highlighted) -->
      <g transform="translate(444, 0)">
        <rect width="206" height="280" rx="12" fill="url(#colBg)" stroke="#10b981" stroke-opacity="0.3" />
        <circle cx="18" cy="20" r="4" fill="#10b981" />
        <text x="28" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Offers (2)</text>

        <!-- Offer Card -->
        <g transform="translate(10, 38)">
          <rect width="186" height="100" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
          <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Software Engineer Intern</text>
          <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">🏢 LSEG Technology</text>
          <rect x="12" y="48" width="162" height="22" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5" />
          <text x="20" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#34d399">🎉 OFFER ACCEPTED</text>
          <text x="12" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Start Date: Jan 2027</text>
        </g>
      </g>
    </g>
  </g>
</svg>